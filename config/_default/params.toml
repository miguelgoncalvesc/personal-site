# Blowfish Theme Parameters

# --- Global ---
logo = "img/brand/logo-horizontal.svg"
tagline = "Engineering leadership · Automation · Applied AI"
disableTextInHeader = true
colorScheme = "mcorte"
defaultAppearance = "light"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
enableScrollToTop = true
mainSections = ["posts"]
smartTOC = true

# --- Header ---
[header]
  layout = "fixed-fill-blur"

# --- Footer ---
[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# --- Homepage ---
[homepage]
  layout = "background"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/posts"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

# --- Article ---
[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "big"
  showBreadcrumbs = true
  showDraftLabel = false
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = false
  showSummary = true

# --- List ---
[list]
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = true
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false

# --- Taxonomy ---
[taxonomy]
  showTermCount = true
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false

# --- Term ---
[term]
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

# --- Post engagement (layouts/partials/sharing-links.html, comments.html) ---

# "Subscribe" block at the end of every post (layouts/partials/sharing-links.html).
# Hidden until url is set.
[subscribe]
  url = ""   # e.g. "https://<name>.substack.com/subscribe"
  title = "Get new posts by email"
  text = "Engineering leadership, automation and applied AI. One email when a new post is out, nothing else."
  button = "Subscribe on Substack"

# Comments + reactions via giscus (GitHub Discussions). Requires the giscus
# GitHub app installed on the repo: https://github.com/apps/giscus
# "Announcements" so only giscus/maintainers can open threads.
[giscus]
  repo = "miguelgoncalvesc/personal-site"
  repoId = "R_kgDOR4_9vQ"
  category = "Announcements"
  categoryId = "DIC_kwDOR4_9vc4DG07D"
  lightTheme = "light"
  darkTheme = "dark_dimmed"
  lang = "en"

# Anonymous likes (theme's built-in Firestore integration). The like button
# only renders once apiKey is set. Values come from Firebase console →
# Project settings → Web app; enable Anonymous auth and Firestore.
[firebase]
  apiKey = ""
  authDomain = ""
  projectId = ""
  storageBucket = ""
  messagingSenderId = ""
  appId = ""
  measurementId = ""
